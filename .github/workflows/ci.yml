name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install extra shells
        run: apt-get update && apt-get install -y --no-install-recommends zsh ksh
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
      - name: Architecture rules
        run: swift test --package-path Architecture
      - name: Build benchmarks
        # Built, not run: timings on shared runners are noise. jemalloc is only needed to count mallocs.
        env:
          BENCHMARK_DISABLE_JEMALLOC: "true"
        run: swift build --package-path Benchmarks -c release
